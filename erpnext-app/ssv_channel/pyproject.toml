[project]
name = "ssv_channel"
authors = [{ name = "SSV Platform" }]
description = "Distributor secondary sales and stock visibility for ERPNext, fed by the SSV Tally connector agent"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
